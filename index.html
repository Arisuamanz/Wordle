<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teka Kata</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation; /* Elak double-tap zoom di mobile */
        }

        .tile {
            transition: transform 0.25s ease, background-color 0.25s ease, border-color 0.25s ease;
            transform-style: preserve-3d;
        }

        .tile.flip-out {
            transform: rotateX(90deg);
        }

        .tile.flip-in {
            transform: rotateX(0deg);
        }

        .tile.pop {
            animation: pop 0.1s ease-in-out;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.5s;
        }

        /* Keyboard styles */
        .key {
            transition: all 0.1s ease;
        }
        .key:active {
            transform: scale(0.95);
        }

        /* Message toast */
        .toast {
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col h-screen">

    <!-- Header -->
    <header class="flex justify-between items-center p-4 border-b border-gray-300 dark:border-gray-700 w-full max-w-lg mx-auto">
        <div class="w-8"></div> <!-- Spacer -->
        <h1 class="text-3xl font-bold tracking-wider uppercase">Teka Kata</h1>
        <div class="flex gap-2">
            <!-- Butang Bunyi -->
            <button id="sound-btn" class="p-2 focus:outline-none hover:text-blue-500 transition">
                <svg id="icon-sound-on" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <svg id="icon-sound-off" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
                </svg>
            </button>
            <!-- Butang Bantuan -->
            <button id="help-btn" class="p-2 focus:outline-none hover:text-blue-500 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Game Message Toast -->
    <div id="toast-container" class="fixed top-20 left-0 right-0 flex flex-col items-center pointer-events-none z-50 space-y-2">
        <!-- Toasts will be injected here -->
    </div>

    <!-- Game Board -->
    <main class="flex-grow flex items-center justify-center overflow-hidden p-4">
        <div id="board" class="grid grid-rows-6 gap-2 w-full max-w-[320px] aspect-[5/6]">
            <!-- Generated by JS -->
        </div>
    </main>

    <!-- Keyboard -->
    <div class="w-full max-w-xl mx-auto pb-8 px-2 select-none">
        <div class="flex justify-center mb-2 gap-1.5 sm:gap-2" id="keyboard-row-1"></div>
        <div class="flex justify-center mb-2 gap-1.5 sm:gap-2" id="keyboard-row-2"></div>
        <div class="flex justify-center gap-1.5 sm:gap-2" id="keyboard-row-3"></div>
    </div>

    <!-- Help Modal -->
    <div id="help-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-gray-800 p-6 rounded-lg max-w-sm w-full mx-4 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Cara Bermain</h2>
                <button id="close-help" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <p class="text-sm mb-4">Teka perkataan 5 huruf dalam 6 percubaan.</p>
            <ul class="text-sm space-y-2 mb-4 list-disc pl-4">
                <li>Setiap tekaan mestilah perkataan 5 huruf.</li>
                <li>Warna petak huruf di atas akan berubah untuk menunjukkan jawapan anda.</li>
            </ul>
            <div class="space-y-3 mb-4">
                <div class="flex gap-1 items-center">
                    <div class="w-8 h-8 bg-green-500 text-white font-bold flex items-center justify-center rounded">B</div>
                    <span class="text-sm ml-2">Huruf berada di tempat yang betul.</span>
                </div>
                <div class="flex gap-1 items-center">
                    <div class="w-8 h-8 bg-yellow-500 text-white font-bold flex items-center justify-center rounded">U</div>
                    <span class="text-sm ml-2">Huruf wujud tapi salah tempat.</span>
                </div>
                <div class="flex gap-1 items-center">
                    <div class="w-8 h-8 bg-gray-500 text-white font-bold flex items-center justify-center rounded">K</div>
                    <span class="text-sm ml-2">Huruf tiada dalam perkataan.</span>
                </div>
            </div>
            <button id="start-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded transition text-lg">
                Faham, Mula Main!
            </button>
        </div>
    </div>

    <script>
        // --- SISTEM BUNYI (WEB AUDIO API) ---
        let audioCtx;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio(); // Pastikan audio aktif

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            if (type === 'type') {
                // Bunyi 'pop' menaip
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'delete') {
                // Bunyi padam rendah sikit
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'flip') {
                // Bunyi flip (huruf didedahkan)
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'error') {
                // Bunyi error (tidak cukup huruf)
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'win') {
                // Melodi pendek untuk menang
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(500, now + 0.1);
                osc.frequency.setValueAtTime(600, now + 0.2);
                osc.frequency.setValueAtTime(800, now + 0.3);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            } else if (type === 'lose') {
                // Bunyi menurun bila kalah
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.5);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        }

        // --- LOGIK PERMAINAN ---
        const WORDS = [
            "MAKAN", "MINUM", "TIDUR", "KASUT", "BOLEH", "TIDAK", "BUNGA", "POKOK", 
            "BULAN", "RUMAH", "ORANG", "HUTAN", "HITAM", "PUTIH", "MERAH", "HIJAU", 
            "BESAR", "KECIL", "CEPAT", "JALAN", "MASUK", "SURAT", "PINTU", "KIPAS", 
            "KASIH", "RINDU", "CINTA", "KAWAN", "LAWAN", "BETUL", "SALAH", "SIHAT", 
            "SAKIT", "PENAT", "LAPAR", "HUJAN", "PANAS", "SEJUK", "ANGIN", "PASIR", 
            "TANAH", "COMEL", "KERAS", "LEMBU", "TELUR", "GARAM", "MANIS", "PAHIT", 
            "MASAM", "MASIN", "GELAP", "CERAH", "SIANG", "MALAM", "KANAN", "DEPAN", 
            "BAWAH", "GURAU", "SUARA", "CERIA", "MULAI", "SABAR", "AKHIR", "RAJIN"
        ];

        let targetWord = WORDS[Math.floor(Math.random() * WORDS.length)];
        let currentRow = 0;
        let currentCol = 0;
        let board = Array.from({ length: 6 }, () => Array(5).fill(''));
        let gameOver = false;

        const boardElement = document.getElementById('board');
        const keyboardRows = [
            ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
            ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
            ['ENTER', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', 'BACKSPACE']
        ];
        
        let keyColors = {}; 

        function initBoard() {
            boardElement.innerHTML = '';
            boardElement.style.gridTemplateColumns = 'repeat(5, minmax(0, 1fr))';
            
            for (let r = 0; r < 6; r++) {
                for (let c = 0; c < 5; c++) {
                    const tile = document.createElement('div');
                    tile.id = `tile-${r}-${c}`;
                    tile.className = 'tile border-2 border-gray-300 dark:border-gray-600 bg-transparent flex items-center justify-center text-3xl font-bold uppercase w-full h-full rounded';
                    boardElement.appendChild(tile);
                }
            }
        }

        function initKeyboard() {
            keyboardRows.forEach((row, i) => {
                const rowElement = document.getElementById(`keyboard-row-${i + 1}`);
                rowElement.innerHTML = '';
                row.forEach(key => {
                    const btn = document.createElement('button');
                    btn.id = `key-${key}`;
                    
                    let flexClass = 'flex-1 text-lg sm:text-xl'; 
                    if (key === 'ENTER' || key === 'BACKSPACE') {
                        flexClass = 'flex-[1.5] text-sm sm:text-base px-1';
                    }

                    btn.className = `key bg-gray-200 dark:bg-gray-700 font-bold h-16 sm:h-20 rounded cursor-pointer ${flexClass} flex items-center justify-center uppercase`;
                    
                    if (key === 'BACKSPACE') {
                        btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 sm:h-8 sm:w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z" /></svg>';
                    } else {
                        btn.textContent = key;
                    }

                    btn.onclick = () => handleKeyPress(key);
                    rowElement.appendChild(btn);
                });
            });
        }

        function handleKeyPress(key) {
            initAudio(); // Aktifkan audio pada sentuhan pertama
            if (gameOver) return;

            if (key === 'ENTER') {
                submitGuess();
            } else if (key === 'BACKSPACE') {
                deleteLetter();
            } else if (/^[A-Z]$/.test(key)) {
                addLetter(key);
            }
        }

        function addLetter(letter) {
            if (currentCol < 5) {
                playSound('type'); // Bunyi type
                board[currentRow][currentCol] = letter;
                const tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
                tile.textContent = letter;
                tile.classList.add('pop');
                tile.classList.replace('border-gray-300', 'border-gray-500');
                tile.classList.replace('dark:border-gray-600', 'dark:border-gray-400');
                
                setTimeout(() => {
                    tile.classList.remove('pop');
                }, 100);

                currentCol++;
            }
        }

        function deleteLetter() {
            if (currentCol > 0) {
                playSound('delete'); // Bunyi delete
                currentCol--;
                board[currentRow][currentCol] = '';
                const tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
                tile.textContent = '';
                tile.classList.replace('border-gray-500', 'border-gray-300');
                tile.classList.replace('dark:border-gray-400', 'dark:border-gray-600');
            }
        }

        function submitGuess() {
            if (currentCol !== 5) {
                playSound('error'); // Bunyi error
                showToast("Perkataan tidak cukup huruf!");
                shakeRow();
                return;
            }

            const guess = board[currentRow].join('');
            checkGuess(guess);
        }

        function shakeRow() {
            const rowTiles = [];
            for (let c = 0; c < 5; c++) {
                rowTiles.push(document.getElementById(`tile-${currentRow}-${c}`));
            }
            rowTiles.forEach(tile => {
                tile.classList.add('shake');
                setTimeout(() => tile.classList.remove('shake'), 500);
            });
        }

        function checkGuess(guess) {
            let targetCharCounts = {};
            for (let i = 0; i < 5; i++) {
                const char = targetWord[i];
                targetCharCounts[char] = (targetCharCounts[char] || 0) + 1;
            }

            let results = Array(5).fill('gray');
            
            for (let i = 0; i < 5; i++) {
                if (guess[i] === targetWord[i]) {
                    results[i] = 'green';
                    targetCharCounts[guess[i]]--;
                }
            }

            for (let i = 0; i < 5; i++) {
                if (results[i] === 'green') continue;
                
                if (targetWord.includes(guess[i]) && targetCharCounts[guess[i]] > 0) {
                    results[i] = 'yellow';
                    targetCharCounts[guess[i]]--;
                }
            }

            animateRow(guess, results);
        }

        function animateRow(guess, results) {
            gameOver = true;
            
            const animationDuration = 250;
            const staggerDelay = 250;

            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    playSound('flip'); // Bunyi petak terbalik
                    const tile = document.getElementById(`tile-${currentRow}-${i}`);
                    
                    tile.classList.add('flip-out');
                    
                    setTimeout(() => {
                        tile.classList.remove('border-gray-500', 'dark:border-gray-400', 'bg-transparent');
                        tile.classList.add('text-white', 'border-transparent', 'dark:border-transparent');
                        
                        if (results[i] === 'green') {
                            tile.classList.add('bg-green-500');
                        } else if (results[i] === 'yellow') {
                            tile.classList.add('bg-yellow-500');
                        } else {
                            tile.classList.add('bg-gray-500', 'dark:bg-gray-600');
                        }
                        
                        tile.classList.remove('flip-out');
                        tile.classList.add('flip-in');

                        setTimeout(() => {
                            tile.classList.remove('flip-in');
                            updateKeyboardColor(guess[i], results[i]);
                        }, animationDuration);

                    }, animationDuration);
                    
                }, i * staggerDelay);
            }

            setTimeout(() => {
                if (guess === targetWord) {
                    playSound('win'); // Bunyi Menang
                    showToast("Hebat! Anda berjaya teka.", 3000);
                    showRestartButton();
                } else {
                    currentRow++;
                    currentCol = 0;
                    if (currentRow > 5) {
                        playSound('lose'); // Bunyi Kalah
                        showToast(`Permainan tamat! Jawapan: ${targetWord}`, 5000);
                        showRestartButton();
                    } else {
                        gameOver = false; 
                    }
                }
            }, 5 * staggerDelay + animationDuration * 2);
        }

        function updateKeyboardColor(letter, result) {
            const keyBtn = document.getElementById(`key-${letter}`);
            if (!keyBtn) return;

            const currentColor = keyColors[letter];

            if (result === 'green') {
                keyColors[letter] = 'green';
            } else if (result === 'yellow' && currentColor !== 'green') {
                keyColors[letter] = 'yellow';
            } else if (result === 'gray' && currentColor !== 'green' && currentColor !== 'yellow') {
                keyColors[letter] = 'gray';
            }

            keyBtn.classList.remove('bg-gray-200', 'dark:bg-gray-700', 'bg-green-500', 'bg-yello
