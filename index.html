<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag untuk paparan penuh pada peranti mudah alih -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Kurumi - Paparan Video Interaktif</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@500;600;700;800&display=swap');

        :root {
            color-scheme: dark;
            --glass-bg: rgba(9, 11, 24, 0.45);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow: hidden;
            touch-action: none;
            background-color: #000;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        #app-screen {
            height: 100svh;
            position: fixed;
            inset: 0;
        }

        #video-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .waifu-vid {
            position: absolute;
            top: -75px; 
            left: 0;
            width: 100%;
            height: calc(100% + 75px); 
            object-fit: cover;
            object-position: top center;
            pointer-events: none;
            
            /* Ganti display:none kepada opacity untuk elak kelipan (flicker) gelap */
            display: block;
            opacity: 0;
            z-index: 1;
            
            filter: saturate(1.05) contrast(1.04);
        }

        /* Video yang sedang aktif */
        .waifu-vid.active {
            opacity: 1;
            z-index: 10;
        }

        #video-container::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 15;
            background:
                linear-gradient(180deg, rgba(3, 6, 18, 0.3) 0%, rgba(3, 6, 18, 0) 40%, rgba(2, 6, 23, 0.1) 70%, rgba(2, 6, 23, 0.75) 100%);
        }

        .hero-backdrop {
            background:
                radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.08), transparent 35%),
                linear-gradient(180deg, rgba(7, 10, 25, 0.4), rgba(4, 4, 10, 0.95));
        }

        .pulse-btn {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 95, 184, 0.6); }
            70% { box-shadow: 0 0 0 18px rgba(255, 95, 184, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 95, 184, 0); }
        }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.14);
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Butang Statik */
        .glass-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="text-white h-screen w-screen flex flex-col font-sans select-none antialiased">

    <!-- SKRIN MULA -->
    <div id="intro-screen" class="flex-1 flex flex-col justify-center items-center w-full h-full z-50 bg-black absolute inset-0 overflow-hidden">
        <div class="hero-backdrop absolute inset-0"></div>
        <div class="absolute inset-0 opacity-40 bg-center bg-cover scale-110" style="background-image: url('https://res.cloudinary.com/dsqi4tm8x/video/upload/v1779046043/1779042912849_sf2w2s.jpg'); filter: blur(20px);"></div>

        <div class="relative z-10 flex flex-col items-center px-6">
            <h1 class="text-4xl font-black text-center mb-12 tracking-widest uppercase bg-gradient-to-r from-pink-400 to-purple-500 bg-clip-text text-transparent drop-shadow-lg" style="font-family: 'Outfit', sans-serif;">
                Kurumi
            </h1>
            <button id="start-btn" class="bg-white/10 backdrop-blur-md border border-white/30 text-white font-bold py-4 px-12 rounded-full uppercase tracking-widest text-sm pulse-btn flex items-center justify-center">
                <span id="start-btn-text">Sentuh untuk Mula</span>
            </button>
        </div>
    </div>

    <!-- SKRIN UTAMA -->
    <div id="app-screen" class="hidden h-full w-full flex flex-col relative bg-black overflow-hidden">
        
        <!-- Bekas Video -->
        <div class="flex-1 relative w-full h-full" id="video-container">
            <video id="video-idle" src="https://res.cloudinary.com/dsqi4tm8x/video/upload/v1779046043/1779042912849_sf2w2s.mp4" class="waifu-vid active" playsinline webkit-playsinline muted loop preload="auto" crossorigin="anonymous"></video>
            <video id="video-fight" src="https://res.cloudinary.com/dsqi4tm8x/video/upload/v1779046045/1779042621899_fhdtse.mp4" class="waifu-vid" playsinline webkit-playsinline muted preload="auto" crossorigin="anonymous"></video>
            <video id="video-greeting" src="https://res.cloudinary.com/dsqi4tm8x/video/upload/v1779046043/1779042897111_bff0ug.mp4" class="waifu-vid" playsinline webkit-playsinline muted preload="auto" crossorigin="anonymous"></video>
        </div>

        <!-- Kawasan Butang -->
        <div class="absolute bottom-10 left-0 right-0 z-30 flex justify-center gap-4 px-6 pointer-events-auto">
            <button id="btn-fight" class="glass-btn flex-1 max-w-[180px] py-4 rounded-2xl text-sm font-bold tracking-widest uppercase text-pink-400 border border-pink-500/20">
                ⚔️ Fighting
            </button>
            <button id="btn-greeting" class="glass-btn flex-1 max-w-[180px] py-4 rounded-2xl text-sm font-bold tracking-widest uppercase text-purple-400 border border-purple-500/20">
                👋 Greeting
            </button>
        </div>
    </div>

    <script>
        const introScreen = document.getElementById('intro-screen');
        const appScreen = document.getElementById('app-screen');
        const startBtn = document.getElementById('start-btn');
        const startBtnText = document.getElementById('start-btn-text');

        const vidIdle = document.getElementById('video-idle');
        const vidFight = document.getElementById('video-fight');
        const vidGreeting = document.getElementById('video-greeting');

        const btnFight = document.getElementById('btn-fight');
        const btnGreeting = document.getElementById('btn-greeting');

        let appStarted = false;
        let isPlayingAction = false;
        let activeVideoElement = vidIdle;
        let queuedVideoElement = null;

        // Fungsi memanggil Skrin Penuh (Fullscreen)
        function enterFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }

        async function startApp() {
            if (appStarted) return;
            startBtnText.innerHTML = `<span class="loader"></span> Memuat...`;
            
            try {
                // Sedia audio & Pra-muat
                vidIdle.muted = false;
                vidFight.muted = false;
                vidGreeting.muted = false;

                await vidIdle.play();
                
                vidFight.load();
                vidGreeting.load();

                // Masuk mod skrin penuh sebaik butang disentuh
                enterFullscreen();

                appStarted = true;
                introScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');

            } catch (err) {
                console.error("Ralat audio:", err);
                startBtnText.innerText = "Sentuh Lagi";
            }
        }

        function playActionVideo(targetVideo) {
            if (!appStarted) return;

            if (isPlayingAction) {
                queuedVideoElement = targetVideo;
                return;
            }

            isPlayingAction = true;

            // Pastikan video baru dimainkan tepat pada masa
            targetVideo.currentTime = 0;
            
            targetVideo.play().then(() => {
                // Menukar kelas (tunjuk/sembunyi) SAHAJA selepas enjin video mula berjalan
                // Mengelakkan kelipan secara efektif
                activeVideoElement.classList.remove('active');
                targetVideo.classList.add('active');
                activeVideoElement = targetVideo;
            }).catch(err => {
                console.error("Gagal main:", err);
                resetToIdle();
            });
        }

        function resetToIdle() {
            isPlayingAction = false;

            if (vidIdle.paused) {
                vidIdle.play().then(() => {
                    activeVideoElement.classList.remove('active');
                    vidIdle.classList.add('active');
                    activeVideoElement = vidIdle;
                });
            } else {
                activeVideoElement.classList.remove('active');
                vidIdle.classList.add('active');
                activeVideoElement = vidIdle;
            }
        }

        function handleVideoEnded(e) {
            const endedVideo = e.target;
            if (endedVideo === vidIdle) return;

            if (queuedVideoElement) {
                const nextVideo = queuedVideoElement;
                queuedVideoElement = null;
                isPlayingAction = false; 
                
                playActionVideo(nextVideo);
            } else {
                resetToIdle();
            }
        }

        vidFight.addEventListener('ended', handleVideoEnded);
        vidGreeting.addEventListener('ended', handleVideoEnded);

        btnFight.addEventListener('click', () => playActionVideo(vidFight));
        btnGreeting.addEventListener('click', () => playActionVideo(vidGreeting));

        startBtn.addEventListener('click', startApp);
        startBtn.addEventListener('touchstart', startApp, {passive: true});
    </script>
</body>
</html>
